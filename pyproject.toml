[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "halostack"
version = "0.4.0"
description = "Stacking and enhancing photographs of ice crystal halos"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Panu Lahtinen", email = "pnuu+git@iki.fi"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Every one of these ships binary wheels for Windows, macOS and Linux, so a
# plain "pip install halostack" needs no compiler and no system packages.
# The lower bounds are the oldest releases that ship wheels for Python 3.12,
# tested together against the full suite rather than guessed at.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.3",
    "imageio>=2.31.5",
    "pillow>=10.1",
    "tifffile>=2023.9.26",
    # PNG is read and written through imagecodecs because Pillow cannot write
    # 16-bit RGB PNG and silently truncates one to 8 bits when reading it.
    "imagecodecs>=2024.6.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
raw = ["rawpy>=0.15"]
gui = ["pyside6-essentials>=6.5"]
tests = ["pytest>=6"]

[project.urls]
Homepage = "https://github.com/pnuu/halostack"
Documentation = "http://halostack.readthedocs.org/"

[project.scripts]
# The window unless the arguments call for the command line; see
# halostack.launcher.
halostack = "halostack.launcher:main"
# Always the command line, whatever the arguments, so that scripts written
# against earlier versions keep working.
halostack_cli = "halostack.cli:main"
halostack_gui = "halostack.gui:main"
halostack_br = "halostack.bin_br:main"

[tool.setuptools]
packages = ["halostack", "halostack.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
