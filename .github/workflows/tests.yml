name: Tests

# Runs the test suite on the two platforms Halostack is used on.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No test opens a window, but a headless runner has no display to open one
  # on, so make sure an accidental import of pyplot cannot hang the job.
  MPLBACKEND: Agg

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # One broken combination should not hide the state of the others.
      fail-fast: false
      matrix:
        # Every supported version on Linux, and the ends of the range on
        # Windows, whose runners cost several times as much per minute. A
        # version-specific failure almost always shows up on both platforms;
        # a platform-specific one shows up on any version.
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
        include:
          - os: ubuntu-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Halostack and its test dependencies
        # Installed rather than run from the checkout, so that the tests
        # exercise what a user would actually get, packaging included.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tests]"

      - name: Show what is installed
        run: python -m pip list

      - name: Run the test suite
        run: pytest -v
